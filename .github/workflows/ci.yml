name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@0b6e74b30ce93e437f8cac74b9c9dd09dc9311e1 # v5.4.5
    with:
      python-version: "3.13"
      runtime-audit-exclude-package: "py-lib-runtime"
      runtime-audit-ignore-vulnerabilities: ""
      playwright-browsers: ""
    secrets:
      app-private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}

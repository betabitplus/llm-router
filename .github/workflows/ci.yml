name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@7673d41339a830761c2f673a7b7491f56f30b008 # v5.4.7
    with:
      python-version: "3.13"
      runtime-audit-exclude-package: "py-lib-runtime"
      runtime-audit-ignore-vulnerabilities: ""
      playwright-browsers: ""
    secrets:
      app-private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@30b0a34aeb46555ddedc9b11d3c685f24d65203c # v5.1.10
    with:
      python-version: "3.13"
      runtime-audit-exclude-package: "py-lib-runtime"
      playwright-browsers: ""
    secrets:
      app-private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}

name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish. Empty uses the latest GitHub release.
        required: false
        type: string
      force:
        description: Rebuild even when the published site already covers the relevant source.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: docs
    if: ${{ vars.TERNFORGE_DOCS_MODE != '' }}
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library-docs.yml@761985d1785596bde89156c5afb95098470ff2ed # v5.4.1
    with:
      python-version: "3.13"
      package-name: "llm_router"
      live-mode: ${{ vars.TERNFORGE_DOCS_MODE }}
      docs-runner: ${{ vars.TERNFORGE_DOCS_RUNNER || 'ubuntu-24.04' }}
      local-environment: ${{ vars.TERNFORGE_DOCS_LOCAL_ENVIRONMENT == 'true' }}
      target-ref: ${{ github.event.release.tag_name || inputs.ref || '' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets:
      app-private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}

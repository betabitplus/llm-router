[project]
name = "exp_0003_gemini_webapi"
version = "0.0.0"
requires-python = "==3.13.7.*"
dependencies = [
  "browser-cookie3",
  "gemini-webapi>=1.21,<1.22",
  "pillow>=12.2",
  "pydantic",
  "pymupdf",
  "py-lib-testkit",
  "tenacity>=9.1.4",
]

[dependency-groups]
report = [
  "ipykernel>=7.3",
  "ipython>=9.14.1",
  "jupyter>=1.1.1",
  "nbclient>=0.10",
  "nbformat>=5.10,<6",
]

[tool.uv]
required-version = "==0.12.5"
sources.py-lib-testkit = { git = "https://github.com/betabitplus/ternforge-tooling-py-testkit.git", tag = "v2.2.2" }
